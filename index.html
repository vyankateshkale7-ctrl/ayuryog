<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AyurYog — Shastra Based Recovery Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<style>
:root{--maroon:#6e1d27;--maroon2:#8a2a35;--ink:#2c2017;--muted:#6b5a48;--cream:#fffaf0;--paper:#fdf6e7;--sand:#f5e8cd;--line:#e6d3ac;--gold:#c9a14a;--green:#4c6b3c;--red:#a3242f;--shadow:0 10px 30px -18px rgba(70,40,10,.45)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;font-family:Mukta,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f8ead0 0,#fbf3e2 380px,#f7eeda 100%);font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
a{color:var(--maroon)}
.dev{font-family:"Tiro Devanagari Sanskrit",Mukta,serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.bar{background:var(--maroon);color:#fff6e8;text-align:center;font-size:14px;padding:8px 16px}
header{position:sticky;top:0;z-index:40;background:rgba(251,243,226,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.brand>div:last-child{min-width:0}
.logo{width:42px;height:42px;border-radius:50%;background:var(--maroon);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.brand b{font-family:Fraunces,serif;font-size:22px;display:block;line-height:1}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
html[lang=hi] .brand small,html[lang=mr] .brand small,html[lang=hi] .eyebrow,html[lang=mr] .eyebrow,html[lang=hi] .tag,html[lang=mr] .tag,html[lang=hi] .blk h4,html[lang=mr] .blk h4{letter-spacing:0}
.helpline{margin-top:8px;font-weight:700}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--cream);flex:none}
.lang button{border:0;background:none;border-radius:999px;padding:5px 11px;font-weight:600;color:var(--ink);font-size:14px}
.lang button.on{background:var(--maroon);color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;font-size:14px;font-weight:600;color:var(--maroon);border:1px solid var(--line);background:var(--cream);padding:4px 12px;border-radius:999px}
section{padding:46px 0 10px}
.eyebrow{font-size:12.5px;letter-spacing:.2em;font-weight:700;color:var(--maroon);text-transform:uppercase}
.sh{margin-bottom:18px}
.sh h2{font-size:clamp(26px,4vw,36px);margin:6px 0 6px}
.sh p{margin:0;color:var(--muted);max-width:720px}
.hero{margin-top:22px;background:var(--cream);border:1px solid var(--line);border-radius:28px;padding:28px 24px;box-shadow:var(--shadow);display:grid;gap:24px}
@media(min-width:860px){.hero{grid-template-columns:1.1fr .9fr;padding:40px}}
.hero h1{font-size:clamp(32px,5vw,50px);margin:12px 0}
.hero p{color:var(--muted);font-size:18px;margin:0 0 16px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pill{border:1px solid var(--line);background:var(--sand);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 18px}
.stat{border-left:3px solid var(--gold);padding:2px 10px}
.stat b{font-family:Fraunces,serif;font-size:24px;display:block}
.stat span{font-size:13.5px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;background:var(--maroon);color:#fff;border-radius:999px;padding:11px 20px;font-weight:600;font-size:16px;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--maroon);border:1.5px solid var(--maroon)}
.btn.sm{padding:7px 14px;font-size:14px}
.heroimg{border-radius:20px;overflow:hidden;min-height:220px;background:var(--sand)}
.heroimg img{width:100%;height:100%;object-fit:cover;display:block}
.fixes{margin-top:16px;background:#fff6e0;border:1px dashed var(--gold);border-radius:16px;padding:12px 16px;font-size:14.5px}
.fixes summary{font-weight:700;cursor:pointer;color:var(--maroon)}
.fixes ul{margin:8px 0 0;padding-left:18px}
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.search{width:100%;border:1px solid var(--line);background:var(--cream);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink)}
.search:focus,.field:focus{outline:2px solid var(--gold);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--cream);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.grid.three{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--cream);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);text-align:left;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:6px;width:100%}
button.card:hover{border-color:var(--gold)}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--maroon)}
.dosha{font-size:13px;font-weight:600;background:var(--sand);border-radius:999px;padding:2px 10px;white-space:nowrap}
.card h3{font-size:21px}
.card p{margin:0;color:var(--muted)}
.more{color:var(--maroon);font-weight:700;font-size:15px;margin-top:4px}
.sub{font-size:13.5px;color:var(--muted)}
.libimg{border-radius:22px;overflow:hidden;margin-bottom:16px;max-height:260px}
.libimg img{width:100%;display:block;object-fit:cover;max-height:260px}
.group{margin:22px 0 10px;font-family:Fraunces,serif;font-size:20px;color:var(--maroon)}
.code{font-size:12.5px;font-weight:700;background:#efe3c4;border-radius:8px;padding:1px 8px;white-space:nowrap}
.kind{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.k-asana{background:#e7efdf;color:#3b5a2c}.k-pranayama,.k-kriya{background:#e1ecf2;color:#2c4f63}.k-modern{background:#f1e2e2;color:#7a2e36}.k-mudra{background:#efe7d4;color:#6b5320}
.safety{background:#fff1ef;border:1px solid #e0a5a5;border-radius:22px;padding:18px 20px}
.safety li{margin:6px 0}
footer{margin-top:40px;background:var(--maroon);color:#fbeee0;padding:32px 0 110px}
footer h3{color:#fff}
footer p{opacity:.9;font-size:15px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(40,20,10,.45);z-index:80;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
@media(min-width:760px){.ov{align-items:center}}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px 30px;position:relative}
@media(min-width:760px){.sheet{border-radius:24px}}
.x{position:sticky;top:0;float:right;border:0;background:var(--sand);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;color:var(--ink);z-index:2}
.sheet h2{font-size:28px;margin:4px 0 6px}
.blk{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.blk h4{font-family:Mukta,sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--maroon);margin:0 0 6px}
.blk p{margin:0}
.blk ul{margin:0;padding-left:18px}
.blk.care{background:#fff1ef;border-color:#e0a5a5}
.blk.care h4{color:var(--red)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:14px;font-weight:600;color:var(--maroon)}
.verse .dev{font-size:21px;line-height:1.5;color:var(--maroon)}
.verse i{display:block;color:var(--muted);font-size:14px;margin:4px 0}
.props{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.props dt{font-weight:700;color:var(--muted)}
.props dd{margin:0}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font:inherit;margin:4px 0 10px}
textarea.field{min-height:120px}
/* chat */
.fab{position:fixed;right:16px;bottom:16px;z-index:60;border:2px solid var(--gold);background:var(--maroon);color:#fff;border-radius:999px;padding:10px 16px 10px 12px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px -8px rgba(60,20,10,.6)}
.fab svg{width:24px;height:24px}
@media(max-width:600px){.fab span{display:none}.fab{padding:12px}}
.chat{position:fixed;right:12px;bottom:12px;left:12px;z-index:70;max-width:420px;margin-left:auto;height:min(620px,80vh);background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 50px -16px rgba(40,20,10,.6);display:none;flex-direction:column;overflow:hidden}
.chat.show{display:flex}
.chead{background:var(--maroon);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.chead b{font-family:Fraunces,serif;font-size:18px}
.chead button{border:0;background:rgba(255,255,255,.15);color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px}
.cbody{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:9px 12px;border-radius:16px;font-size:15px}
.msg.bot{background:var(--cream);border:1px solid var(--line);align-self:flex-start}
.msg.user{background:var(--maroon);color:#fff;align-self:flex-end}
.msg.urgent{background:#fff1ef;border:1.5px solid var(--red);color:#5c1016;font-weight:600}
.msg .links{margin-top:8px}
.cform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--cream)}
.cform input{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font:inherit;background:#fff;min-width:0}
.cform button{border:0;background:var(--maroon);color:#fff;border-radius:999px;padding:0 16px;font-weight:700}
.emerg{background:#a3242f;color:#fff;border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:14px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.pstat{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.pstat b{font-family:Fraunces,serif;font-size:24px;display:block;color:var(--maroon)}
.pstat span{font-size:13px;color:var(--muted)}
.rank{font-family:Fraunces,serif;font-size:28px;color:var(--gold);line-height:1}
.deaths{font-weight:700;color:var(--maroon)}
.k-ncd{background:#efe3c4;color:#6b5320}.k-comm{background:#e1ecf2;color:#2c4f63}
.blk.signs{background:#fff1ef;border-color:#e0a5a5}.blk.signs h4{color:var(--red)}
.qchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.qchips .lk{font-size:13px;padding:3px 9px}
.empty{color:var(--muted);padding:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div class="bar" data-t="disclaimer"></div>
<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand"><div class="logo dev">ॐ</div><div><b data-t="title"></b><small data-t="subtitle"></small></div></div>
      <div class="lang" id="lang"><button data-l="en">EN</button><button data-l="hi">हिंदी</button><button data-l="mr">मराठी</button></div>
    </div>
    <nav>
      <a href="#conditions" data-t="navCond"></a><a href="#prevention" data-t="navPrev"></a><a href="#library" data-t="navLib"></a><a href="#herbs" data-t="navHerb"></a><a href="#yoga" data-t="navYoga"></a><a href="#therapies" data-t="navTher"></a><a href="#journal" data-t="navJournal"></a><a href="#safety" data-t="navSafety"></a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <div>
      <div class="eyebrow" data-t="tag"></div>
      <h1 data-t="heroTitle"></h1>
      <p data-t="heroText"></p>
      <div class="pills"><span class="pill">Vata · Movement</span><span class="pill">Pitta · Heat</span><span class="pill">Kapha · Stability</span><span class="pill">Ojas · Vitality</span></div>
      <div class="stats">
        <div class="stat"><b id="sCond"></b><span data-t="statCond"></span></div>
        <div class="stat"><b id="sBooks"></b><span data-t="statBooks"></span></div>
        <div class="stat"><b id="sHerbs"></b><span data-t="statHerbs"></span></div>
        <div class="stat"><b data-t="statDose"></b><span data-t="statDoseSub"></span></div>
      </div>
      <div class="btns"><a class="btn" href="#conditions" data-t="explore"></a><a class="btn ghost" href="#library" data-t="openLib"></a></div>
      <details class="fixes"><summary data-t="fixes"></summary><ul id="fixList"></ul></details>
    </div>
    <div class="heroimg"><img src="images/library.webp" alt="Palm-leaf manuscripts, herbs and a brass lamp"></div>
  </div>

  <section id="conditions">
    <div class="sh"><div class="eyebrow">Shastra · Dinacharya</div><h2 data-t="conditions"></h2><p data-t="condSub"></p></div>
    <div class="tools">
      <input class="search" id="q" type="search" autocomplete="off">
      <div class="chips" id="cats"></div>
    </div>
    <div class="grid three" id="condGrid"></div>
  </section>

  <section id="prevention">
    <div class="sh"><div class="eyebrow">WHO · Prevention</div><h2 data-t="prevTitle"></h2><p data-t="prevSub"></p></div>
    <div class="emerg" data-t="emergencyL"></div>
    <div class="pstats" id="pstats"></div>
    <div class="group" data-t="habitsL"></div>
    <div class="grid three" id="habitGrid"></div>
    <div class="group">Top 10 · WHO 2023</div>
    <div class="grid three" id="disGrid"></div>
    <div class="group" data-t="alsoL"></div>
    <div class="grid three" id="extraGrid"></div>
    <div class="blk" style="margin-top:18px"><h4 data-t="factsL"></h4><ul id="factList"></ul><p class="note" id="prevSrc"></p></div>
  </section>

  <section id="library">
    <div class="sh"><div class="eyebrow">Grantha</div><h2 data-t="library"></h2><p data-t="librarySub"></p></div>
    <div id="libList"></div>
  </section>

  <section id="herbs">
    <div class="sh"><div class="eyebrow">Dravyaguna · Nighantu</div><h2 data-t="herbLib"></h2><p data-t="herbLibSub"></p></div>
    <div class="libimg"><img src="images/herbs.webp" alt="Bowls of turmeric, ashwagandha root, tulsi, haritaki, ginger and brahmi"></div>
    <div class="tools"><input class="search" id="hq" type="search" autocomplete="off"><div class="chips" id="hcats"></div></div>
    <div class="grid three" id="herbGrid"></div>
  </section>

  <section id="yoga">
    <div class="sh"><div class="eyebrow">Hatha · Pranayama</div><h2 data-t="yogaLib"></h2><p data-t="yogaLibSub"></p></div>
    <div class="libimg"><img src="images/yoga.webp" alt="Illustration of Tadasana, Vrikshasana, Bhujangasana and Padmasana" style="object-position:center 30%"></div>
    <div class="tools"><div class="chips" id="ycats"></div></div>
    <div class="grid three" id="yogaGrid"></div>
  </section>

  <section id="therapies">
    <div class="sh"><div class="eyebrow">Chikitsa</div><h2 data-t="therapyG"></h2><p data-t="therSub"></p></div>
    <div class="grid three" id="therGrid"></div>
  </section>

  <section id="journal">
    <div class="sh"><div class="eyebrow">AyurYog</div><h2 data-t="journal"></h2><p data-t="journalSub"></p></div>
    <div class="row" style="margin-bottom:14px"><button class="btn sm" id="addPost" data-t="add"></button><button class="btn sm ghost" id="resetPosts" data-t="resetPosts"></button><span class="sub" data-t="journalLocal"></span></div>
    <div class="grid three" id="postGrid"></div>
  </section>

  <section id="safety">
    <div class="sh"><div class="eyebrow">Suraksha</div><h2 data-t="safety"></h2><p data-t="safetySub"></p></div>
    <div class="safety"><ul id="safeList"></ul></div>
  </section>
</main>

<footer><div class="wrap"><h3 data-t="footerTitle"></h3><p data-t="footerText"></p><p class="sub" style="color:#f3dcc4" data-t="disclaimer"></p></div></footer>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<button class="fab" id="fab" aria-label="Open AyurYog Mitra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><span>AyurYog Mitra</span></button>
<div class="chat" id="chat" role="dialog" aria-label="AyurYog Mitra">
  <div class="chead"><b>AyurYog Mitra</b><button id="cclose" aria-label="Close">×</button></div>
  <div class="cbody" id="cbody"></div>
  <form class="cform" id="cform"><input id="cin" autocomplete="off"><button data-t="send"></button></form>
</div>

const POSTS=[{"title": "Dinacharya: A Morning That Holds You", "excerpt": "Wake, water, light, movement — a simple classical rhythm for Vata, Pitta and Kapha.", "category": "Dinacharya", "read": "4", "body": "Classical Dinacharya begins before the day rushes in. Warm water, sunlight, gentle movement and a regular breakfast time are small anchors. The point is not perfection — it is a rhythm the body can trust."}, {"title": "What Is Dosha, Really?", "excerpt": "Vata, Pitta and Kapha are patterns, not labels. Learn to read them gently.", "category": "Foundations", "read": "5", "body": "Dosha describes tendencies: movement and dryness, heat and transformation, heaviness and stability. Most people carry a mix. This guide uses dosha as a learning lens, not a diagnosis."}, {"title": "Abhyanga at Home: Gentle, Not Complicated", "excerpt": "Warm oil, slow strokes, and rest afterwards. That is the heart of it.", "category": "Therapies", "read": "4", "body": "Ashtanga Hridayam (Sutrasthana 2) advises abhyanga daily, especially on the head, ears and feet. At home: warm sesame oil for Vata, coconut or sunflower for Pitta, a lighter oil and less of it for Kapha. Keep strokes slow, skip it during fever or indigestion, and rest with warm water afterwards."}, {"title": "Marma: Small Points, Quiet Attention", "excerpt": "Sushruta describes 107 marma points. At home, they call for gentle attention — not pressure.", "category": "Therapies", "read": "3", "body": "Marma are vital points where muscle, vessels, ligaments, bone and joints meet. Sushruta Samhita (Sharira 6) lists 107 of them and warns that injury to some can be serious. At home this means gentle, respectful touch and breath during abhyanga — never strong pressure or 'treatment'. Therapeutic marma work needs a trained practitioner."}, {"title": "Food as Daily Medicine", "excerpt": "Warm, timely, simple. Agni is protected by how we eat.", "category": "Food", "read": "4", "body": "Classical food wisdom is simple: eat warm, eat on time, chew well, and leave space. Cold, hurried and late meals are traditionally seen as burdens on agni."}, {"title": "Sleep Is a Pillar, Not a Luxury", "excerpt": "Ahara, nidra and brahmacharya — the three supports of life in Charaka Samhita.", "category": "Sleep", "read": "3", "body": "Charaka Samhita (Sutrasthana 11) names three supports (upastambha) of life: food, sleep and a disciplined life. Charaka (Sutrasthana 21) adds that happiness and sorrow, strength and weakness all depend on sleep. A dark room, a regular time and a calm last hour are the gentlest medicines for a restless mind."}, {"title": "Brihat Trayi and Laghu Trayi", "excerpt": "The six books every Ayurveda student starts with — and why.", "category": "Foundations", "read": "5", "body": "The Brihat Trayi (great three) are Charaka Samhita (internal medicine), Sushruta Samhita (surgery and anatomy) and Ashtanga Hridayam (Vagbhata's clear summary of both). The Laghu Trayi (lesser three) are Madhava Nidana (diagnosis), Sharangadhara Samhita (pharmacy) and Bhavaprakasha (a later compendium with the most-used herb dictionary). Together they cover principles, diagnosis, medicines and herbs."}, {"title": "Reading a Herb Card", "excerpt": "Rasa, guna, virya, vipaka — four words that describe every herb.", "category": "Foundations", "read": "4", "body": "Rasa is taste (sweet, sour, salty, pungent, bitter, astringent). Guna are qualities such as heavy or light, oily or dry. Virya is potency — heating or cooling. Vipaka is the effect after digestion. Together they predict which dosha a herb calms or raises. Example: Amla is sour, cooling and sweet after digestion, so it calms Pitta even though it is sour. Texts sometimes disagree — that is normal."}];

const FAQ = [
  {k:["how much salt","salt per day","salt limit","नमक कितना","मीठ किती"], a:"WHO advises under 5 g of salt a day — about one level teaspoon, including salt already in food like pickles, papad, namkeen and packaged snacks."},
  {k:["how much exercise","how much walking","how many steps","exercise per week","कितना व्यायाम","किती व्यायाम","कितना चलना","किती चालावे"], a:"WHO recommends 150–300 minutes of moderate activity a week (for example 30–45 minutes of brisk walking on most days), or 75–150 minutes of vigorous activity, plus muscle-strengthening 2 days a week."},
  {k:["is ghee good","is ghee bad","ghee heart","ghee cholesterol","घी अच्छा","तूप चांगले"], a:"Ghee is nourishing in Ayurveda and fine in small amounts for most people. It is a saturated fat, so with high cholesterol, heart disease or obesity keep it to a little and favour oils like mustard or groundnut in moderation."},
  {k:["can ayurveda cure cancer","ayurveda cancer","herbs cure cancer","cancer cure","कैंसर का इलाज","कर्करोग उपचार"], a:"No. No herb or Ayurvedic product is proven to cure cancer, and delaying treatment can cost a life. Ayurveda, yoga and good food can support comfort during treatment — only with your oncologist's agreement."},
  {k:["can i stop medicine","stop my medicine","stop tablets","stop insulin","replace medicine","दवा बंद","औषध बंद"], a:"Please do not stop or change prescribed medicine on your own — for BP, sugar, heart, thyroid, TB or anything else. Herbs can be discussed with your doctor as support, not a replacement."},
  {k:["normal bp","normal blood pressure","bp range","नॉर्मल बीपी","सामान्य रक्तदाब"], a:"Around 120/80 is ideal. 140/90 or above on repeated checks usually means high blood pressure — see a doctor. Above 180/120 with symptoms is an emergency."},
  {k:["normal sugar","sugar level","fasting sugar","normal blood sugar","शुगर लेवल","साखर किती"], a:"Fasting blood sugar under 100 mg/dL is normal; 100–125 suggests prediabetes; 126 or above on two tests suggests diabetes. HbA1c under 5.7% is normal, 5.7–6.4% prediabetes, 6.5% or above diabetes. Confirm with a doctor."},
  {k:["bmi","ideal weight","normal weight","आदर्श वजन"], a:"BMI = weight (kg) ÷ height (m)². For Indians: 18.5–22.9 is healthy, 23–24.9 overweight, 25 and above obese. Waist size matters too: aim under about 90 cm for men and 80 cm for women."},
  {k:["heart attack symptoms","signs of heart attack","heart attack sign","हार्ट अटैक के लक्षण","हृदयविकाराचा झटका"], a:"Chest pain, pressure or tightness that may spread to the arm, jaw or back, with sweating, breathlessness or nausea. Call 108 or 112 immediately."},
  {k:["stroke symptoms","signs of stroke","be fast","fast test","लकवे के लक्षण","पक्षाघाताची लक्षणे"], a:"BE FAST: Balance loss, Eyes (sudden vision loss), Face drooping, Arm weakness, Speech slurred — Time to call 108/112. Treatment works best in the first few hours."},
  {k:["ors","how to make ors","oral rehydration","ओआरएस"], a:"Use a WHO-ORS packet mixed exactly as written (usually in 1 litre of clean water). If no packet: 6 level teaspoons sugar + half a level teaspoon salt in 1 litre of clean boiled-and-cooled water. Children also need zinc as advised by a health worker. Seek care for blood in stool or signs of dehydration."},
  {k:["vaccine","vaccines","vaccination","टीका","टीके","लस"], a:"Follow India's free childhood immunisation schedule. Adults: flu vaccine yearly and pneumococcal vaccine are advised for older people and those with chronic disease; hepatitis B for those not vaccinated; HPV for girls (recommended at 9–14). Ask your doctor what fits you."},
  {k:["what is dosha","dosha","vata pitta kapha","दोष क्या","दोष काय"], a:"Vata, Pitta and Kapha are the three doshas — patterns of movement, heat/transformation and stability (Ashtanga Hridayam, Sutrasthana 1). Most people are a mix. This guide uses dosha as a learning lens, not a diagnosis."},
  {k:["quit smoking","stop smoking","quit tobacco","leave gutkha","सिगरेट छोड़","तंबाकू छोड़","धूम्रपान सोड"], a:"Quitting at any age helps — heart risk starts falling within a year. Set a quit date, remove tobacco from home, tell family, and use support: India's National Tobacco Quitline is 1800-112-356 (free). Nicotine replacement from a doctor can help. Pranayama and walking can ease cravings."},
  {k:["who are you","what can you do","help","आप कौन","तुम्ही कोण"], a:"I'm AyurYog Mitra. Ask me about a health concern (like sleep, acidity or BP), a disease (heart disease, diabetes, cancer, TB), a herb (amla, ashwagandha), prevention, warning signs or yoga. I give education, never a diagnosis or a dose."}

/* ---------- conditions ---------- */
function condText(c){
  const L=cn(c), parts=[c.en.name,c.hi.name,c.mr.name,L.short,c.term,c.dosha,c.tag];
  (c.herbs||[]).forEach(h=>{const x=herbById[h]; if(x) parts.push(x.name,x.san,x.hi)});
  (c.yoga||[]).concat(c.breath||[]).forEach(y=>{const x=yogaById[y]; if(x) parts.push(x.name,x.en)});
  return parts.join(" ").toLowerCase();
}
function renderCats(){
  const cats=["All",...new Set(CONDS.map(c=>c.tag))];
  $("#cats").innerHTML=cats.map(c=>`<button class="chip${c===cat?" on":""}" data-c="${esc(c)}">${esc(c==="All"?t("all")+" "+CONDS.length:catName(c))}</button>`).join("");
}
function renderConds(){
  const q=$("#q").value.trim().toLowerCase();
  const list=CONDS.filter(c=>(cat==="All"||c.tag===cat)&&(!q||condText(c).includes(q)));
  $("#condGrid").innerHTML=list.length?list.map(c=>{const L=cn(c);return `<button class="card" data-cond="${c.id}"><div class="ctop"><span class="tag">${esc(catName(c.tag))}</span><span class="dosha">${esc(c.dosha)}</span></div><h3>${esc(L.name)}</h3><p>${esc(L.short)}</p><span class="sub">${esc(c.term)}</span><span class="more">${esc(t("readMore"))} →</span></button>`}).join(""):`<p class="empty">${esc(t("noResults"))}</p>`;
}

}
function postForm(p){
  p=p||{title:"",excerpt:"",category:"Dinacharya",read:"4",body:""};

/* ---------- chat ---------- */
const isDev=s=>/[\u0900-\u097F]/.test(s);
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function hit(text,kw){ kw=kw.toLowerCase(); if(isDev(kw)) return text.includes(kw); return new RegExp("(^|[^a-z])"+reEsc(kw)+"(s|es)?(?![a-z])","i").test(text); }
const score=(text,list)=>(list||[]).reduce((a,k)=>a+(hit(text,k)?(k.length>4?2:1):0),0);
const HERB_KEYS=HERBS.map(h=>({id:h.id,keys:[h.name,h.name.split(" (")[0],h.san,h.hi,h.dev].concat(h.hi.split(/\s*\/\s*/)).filter(k=>k&&k.length>2&&k!=="—")}));
const INTENTS={
  prevent:["prevent","prevention","preventing","avoid","reduce risk","lower risk","protect","stop getting","बचाव","रोकथाम","बचें","बचना","रोकें","टाळ","प्रतिबंध","बचाव कसा"],
  signs:["symptom","symptoms","sign","signs","warning","how do i know","लक्षण","संकेत","चिन्ह"],
  risks:["cause","causes","risk","risks","why","reason","कारण","जोखिम","धोका","क्यों","का होतो"],
  ayur:["ayurveda","ayurvedic","herb","herbs","yoga","natural","home remedy","remedies","pranayama","आयुर्वेद","योग","जड़ी","घरेलू","उपाय","वनस्पती","घरगुती"],
  screen:["test","tests","check","checkup","check-up","screening","diagnose","जाँच","जांच","टेस्ट","तपासणी","चाचणी"]
};
let lastDis=null;
function analyse(msg){
  const text=msg.toLowerCase();
  if(EMERGENCY.some(k=>isDev(k)?text.includes(k):text.includes(k.toLowerCase()))) return {kind:"urgent",selfharm:SELFHARM.some(k=>text.includes(k))};
  const intent=Object.keys(INTENTS).find(i=>INTENTS[i].some(k=>hit(text,k)))||null;
  const faq=FAQ.map(f=>({f,s:score(text,f.k)})).sort((a,b)=>b.s-a.s)[0];
  if(faq&&faq.s>=2) return {kind:"faq",a:faq.f.a};
  const dis=DISEASES.concat(EXTRAS).map(d=>({id:d.id,s:score(text,d.kw)})).sort((a,b)=>b.s-a.s)[0];
  const cond=CONDS.map(c=>({id:c.id,s:score(text,KW[c.id])})).sort((a,b)=>b.s-a.s);
  const herbs=HERB_KEYS.filter(h=>h.keys.some(k=>hit(text,k))).map(h=>h.id);
  if(dis.s>0&&(intent||dis.s>=cond[0].s)) return {kind:"dis",id:dis.id,intent};
  if(cond[0].s>0) return {kind:"cond",id:cond[0].id,also:cond.filter(x=>x.s>0).slice(1,3).map(x=>x.id),herbs,dis:dis.s>0?dis.id:null};
  if(herbs.length) return {kind:"herb",herbs};
  if(dis.s>0) return {kind:"dis",id:dis.id,intent};
  if(intent&&lastDis) return {kind:"dis",id:lastDis,intent};
  if(faq&&faq.s>0) return {kind:"faq",a:faq.f.a};
  return {kind:"none"};
}
let chatLog=[];
function bot(html,cls){ chatLog.push(`<div class="msg bot${cls?" "+cls:""}">${html}</div>`); }
function chips(ids){ return `<div class="links">${ids.map(id=>`<button class="lk" data-chat="${id}">${esc(cn(condById[id]).name)}</button>`).join("")}</div>`; }
const QL={prevent:"preventL",signs:"signsL",risks:"risksL",ayur:"ayurL",screen:"screenL"};
function disReply(id,intent){
  const d=disById[id]; lastDis=id;
  const list=a=>"<ul style='margin:6px 0 0;padding-left:18px'>"+a.map(x=>`<li>${esc(x)}</li>`).join("")+"</ul>";
  let body;
  if(intent==="prevent") body=`<b>${esc(t("preventL"))}</b>`+list(d.prevent);
  else if(intent==="signs") body=`<b>${esc(t("signsL"))}</b><br>${esc(d.signs)}`;
  else if(intent==="risks") body=`<b>${esc(t("risksL"))}</b>`+list(d.risks);
  else if(intent==="ayur") body=`<b>${esc(t("ayurL"))}</b><br>${esc(d.ayur)}`;
  else if(intent==="screen") body=`<b>${esc(t("screenL"))}</b><br>${esc(d.screen)}`;
  else body=`${esc(d.overview)}<br><br><b>${esc(t("preventL"))}</b>`+list(d.prevent.slice(0,3));
  const others=Object.keys(QL).filter(q=>q!==intent);
  bot(`<b>${esc(dname(d))}</b>${d.rank?` · <span class="sub">#${d.rank} · ${esc(d.deaths)}</span>`:""}<br>${body}
   ${intent!=="signs"?`<p class="note" style="margin:8px 0 0">⚠ ${esc(d.signs.split(". ").slice(0,2).join(". "))}.</p>`:""}
   <div class="qchips">${others.map(q=>`<button class="lk" data-dq="${id}|${q}">${esc(t(QL[q]))}</button>`).join("")}<button class="lk" data-dis="${id}">${esc(t("readMore"))}</button>${(d.links||[]).map(c=>`<button class="lk" data-cond="${c}">${esc(cn(condById[c]).name)}</button>`).join("")}</div>`);
}
function condReply(id,also){
  const c=condById[id], L=cn(c);
  const herbs=(c.herbs||[]).slice(0,3).map(h=>herbById[h].name).join(", ");
  const yoga=(c.yoga||[]).slice(0,2).concat((c.breath||[]).slice(0,1)).map(y=>yogaById[y].name).join(", ");
  bot(`<b>${esc(L.name)}</b> · <span class="sub">${esc(c.term)}</span><br>${esc(L.view)}<br><br>🌿 ${esc(herbs)}<br>🧘 ${esc(yoga)}<br>🍲 ${esc(c.diet)}<br><span class="note">${esc(CHAT[lang].precaution)}</span><br><span class="note">⚠ ${esc(c.care)}</span><div class="links"><button class="lk" data-cond="${id}">${esc(CHAT[lang].viewGuide)}</button></div>${also&&also.length?chips(also):""}`);
}
function herbReply(ids){ ids.slice(0,2).forEach(id=>{const h=herbById[id]; bot(`<b>${esc(h.name)}</b> · <span class="dev">${esc(h.dev)}</span> <span class="code">${esc(h.code)}</span><br>${esc(h.dosha)}. ${esc(h.uses)}.<br><span class="note">⚠ ${esc(h.safety)}</span><div class="links"><button class="lk" data-herb="${id}">${esc(t("readMore"))}</button></div>`);}); }
function renderChat(){ if(!chatLog.length){ bot(esc(CHAT[lang].greeting)+`<p class="note" style="margin:6px 0 0">${esc(t("chatHint"))}</p>`+chips(CHAT.en.chips.map(c=>c.id))+`<div class="qchips">${["ihd","diabetes2","cancer","stroke"].map(id=>`<button class="lk" data-dq="${id}|prevent">${esc(dname(disById[id]))}</button>`).join("")}</div>`); } $("#cbody").innerHTML=chatLog.join(""); $("#cbody").scrollTop=1e6; }
function respond(r,text){
  if(r.kind==="urgent"){ bot(esc(CHAT[lang].urgent)+`<div class="helpline">${esc(t("emergencyL"))}</div>`+(r.selfharm?`<div class="helpline">${esc(t("helpline"))}</div>`:""),"urgent"); }
  else if(r.kind==="faq") bot(esc(r.a)+`<p class="note" style="margin:6px 0 0">${esc(t("disclaimer"))}</p>`);
  else if(r.kind==="dis") disReply(r.id,r.intent);
  else if(r.kind==="cond"){ condReply(r.id,r.also); if(r.herbs.length) herbReply(r.herbs.filter(h=>!(condById[r.id].herbs||[]).includes(h))); }
  else if(r.kind==="herb") herbReply(r.herbs);
  else bot(esc(CHAT[lang].noMatch)+" "+esc(t("chatHint"))+chips(["stress","sleep","acidity","joint"]));
}
function userSays(text){ chatLog.push(`<div class="msg user">${esc(text)}</div>`); respond(analyse(text),text); renderChat(); }

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-dis],[data-dq],[data-cond],[data-herb],[data-yoga],[data-book],[data-post],[data-edit],[data-del],[data-close],[data-chat],[data-c],[data-h],[data-y],[data-l]");
  if(!el) { if(e.target.id==="ov") close(); return; }
  const d=el.dataset;
  if(d.close!==undefined) return close();
  if(d.l){ lang=d.l; store.set("ayuryog_lang",lang); chatLog=[]; renderAll(); return; }
  if(d.c){ cat=d.c; renderCats(); renderConds(); return; }
  if(d.h){ herbCat=d.h; renderHerbs(); return; }
  if(d.y){ yogaCat=d.y; renderYoga(); return; }
  if(d.chat){ userSays(cn(condById[d.chat]).name); return; }
  if(d.dq){ const [id,q]=d.dq.split("|"); chatLog.push(`<div class="msg user">${esc(dname(disById[id]))} — ${esc(t(QL[q]))}</div>`); disReply(id,q); renderChat(); return; }
  if(d.dis){ return openDis(d.dis); }
  if(d.cond) return openCond(d.cond);
  if(d.herb) return openHerb(d.herb);
  if(d.yoga) return openYoga(d.yoga);
  if(d.book) return openBook(d.book);
  if(d.post){ const p=posts.find(x=>x.id===d.post); if(p) open(`<span class="tag">${esc(p.category)}</span><h2>${esc(p.title)}</h2><p class="sub">${esc(p.excerpt)}</p><div class="blk"><p style="white-space:pre-wrap">${esc(p.body)}</p></div>`); return; }
  if(d.edit){ postForm(posts.find(x=>x.id===d.edit)); return; }
  if(d.del){ if(pendingDel===d.del){ posts=posts.filter(x=>x.id!==d.del); pendingDel=null; savePosts(); } else { pendingDel=d.del; setTimeout(()=>{if(pendingDel===d.del){pendingDel=null;renderPosts();}},4000); } renderPosts(); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ close(); $("#chat").classList.remove("show"); } });
$("#q").addEventListener("input",renderConds);
$("#hq").addEventListener("input",renderHerbs);
$("#addPost").addEventListener("click",()=>postForm());
$("#resetPosts").addEventListener("click",()=>{ posts=POSTS.map((p,i)=>Object.assign({id:"s"+i},p)); savePosts(); renderPosts(); });
$("#fab").addEventListener("click",()=>{ $("#chat").classList.add("show"); renderChat(); setTimeout(()=>$("#cin").focus(),50); });
$("#cclose").addEventListener("click",()=>$("#chat").classList.remove("show"));
$("#cform").addEventListener("submit",e=>{ e.preventDefault(); const v=$("#cin").value.trim(); if(!v) return; $("#cin").value=""; userSays(v); });

function renderAll(){ applyStatic(); renderCats(); renderConds(); renderPrev(); renderLib(); renderHerbs(); renderYoga(); renderTher(); renderPosts(); if($("#chat").classList.contains("show")) renderChat(); }
posts=loadPosts();
renderAll();
window.__ayur={analyse};
})();
